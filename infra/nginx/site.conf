# /etc/nginx/sites-available/default
# Cópia versionada da config da VM (2026-10-17). Linhas "managed by Certbot" devem ficar intactas.

server {
        listen 80;
        listen [::]:80;
        root /var/www/html;
        index index.html index.htm index.nginx-debian.html;
        server_name manasomali.com www.manasomali.com;
        return 301 https://$server_name$request_uri;
        location / {
                try_files $uri $uri/ /index.html =404;
        }
}
server {
        listen [::]:443 ssl; # managed by Certbot
        listen 443 ssl; # managed by Certbot

        ssl_certificate /etc/letsencrypt/live/manasomali.com/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/manasomali.com/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        root /var/www/html;
        index index.html index.htm index.nginx-debian.html;
        server_name manasomali.com www.manasomali.com;
        add_header Strict-Transport-Security "max-age=31536000" always; # prevent man in the middle attacks

        # Backends dos projetos: um arquivo por projeto (location /api/<projeto>/)
        include /etc/nginx/apps.d/*.conf;

        # Um add_header dentro de location apaga os do server: por isso o HSTS se repete em cada um.

        # index.html e arquivos sem hash no nome: o navegador sempre revalida (ETag). Sem
        # Cache-Control, ele guardava o index.html por cache heurístico e, depois de um deploy
        # (rsync --delete), pedia um bundle que não existia mais: tela em branco
        location / {
                try_files $uri $uri/ /index.html =404;

                add_header Cache-Control "no-cache" always;
                add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # Arquivos com hash no nome (o vite build os põe em /assets/): cache longo. Arquivo que
        # não existe é 404, nunca o index.html, que como text/html quebra o <script type="module">
        location /assets/ {
                try_files $uri =404;

                add_header Cache-Control "public, max-age=31536000, immutable" always;
                add_header Strict-Transport-Security "max-age=31536000" always;
        }
}
