# Rotas do ethos, incluídas no server 443 do site (/etc/nginx/apps.d/ethos.conf). A porta vem do app.conf.
# Um add_header dentro de location apaga os do server: por isso o HSTS do site se repete em cada um.

location = /ethos {
        return 301 /ethos/;
}

# Frontend (SPA). index.html e arquivos sem hash no nome: o navegador sempre revalida
location /ethos/ {
        alias /var/www/ethos/;
        # index.html como arquivo e =404 no fim, como no site: antes do primeiro deploy (sem
        # index.html) é 404, e não um ciclo de redirecionamento interno (500)
        try_files $uri $uri/ /ethos/index.html =404;

        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# Arquivos com hash no nome: cache longo. Arquivo que não existe é 404, nunca o index.html
location /ethos/assets/ {
        alias /var/www/ethos/assets/;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# Login e códigos por email: 10 por minuto por IP, rajada de 5 (zona em /etc/nginx/conf.d/ethos.conf)
location /api/ethos/auth/ {
        limit_req zone=ethos_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:__PORTA__/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 5m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# API: o prefixo /api/ethos sai antes de chegar no uvicorn (que recebe --root-path /api/ethos)
location /api/ethos/ {
        proxy_pass http://127.0.0.1:__PORTA__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 5m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}
