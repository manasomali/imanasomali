# Rotas do ethos, incluídas no server 443 do site (/etc/nginx/apps.d/ethos.conf). A porta vem do app.conf.
# Um add_header dentro de location apaga os do server: por isso o HSTS do site se repete em cada um.

location = /ethos {
        return 301 /ethos/;
}

# Frontend (SPA). index.html e arquivos sem hash no nome: o navegador sempre revalida
# root /var/www (e não alias /var/www/ethos/): a pasta tem o nome do prefixo, e o alias tem um bug
# conhecido com try_files que não acha o /ethos/index.html. Sem $uri/ (pasta) e com =404 no fim:
# antes do primeiro deploy, sem index.html, o /ethos/ dá 404, e não 403 (pasta sem índice) nem um
# ciclo de redirecionamento (500)
location /ethos/ {
        root /var/www;
        try_files $uri /ethos/index.html =404;

        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# Arquivos com hash no nome: cache longo. Arquivo que não existe é 404, nunca o index.html
location /ethos/assets/ {
        root /var/www;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# Toda location que chega ao backend define os cinco X-User-* (imago-plan.md, "como as aplicações
# sabem quem é o usuário"): a partir do imago, no /api/ethos/, ou vazios, nas outras (o nginx não
# manda header vazio). Assim nenhum X-User-* mandado pelo navegador chega ao ethos.

# Login e códigos por email do próprio ethos, até a passagem do login para o imago (ETH-64): 10 por
# minuto por IP, rajada de 5 (zona em /etc/nginx/conf.d/ethos.conf)
location /api/ethos/auth/ {
        limit_req zone=ethos_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:__PORTA__/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Email "";
        proxy_set_header X-User-Locale "";
        proxy_set_header X-User-Timezone "";
        proxy_set_header X-User-Admin "";
        proxy_read_timeout 30s;
        client_max_body_size 5m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# API: o prefixo /api/ethos sai antes de chegar no uvicorn (que recebe --root-path /api/ethos).
# Quem é o usuário: o nginx pergunta ao imago (/_imago/session, em /etc/nginx/apps.d/imago.conf) e
# repassa a resposta. Sem o imago no ar, responde 500
location /api/ethos/ {
        auth_request /_imago/session;
        auth_request_set $imago_user_id $upstream_http_x_user_id;
        auth_request_set $imago_user_email $upstream_http_x_user_email;
        auth_request_set $imago_user_locale $upstream_http_x_user_locale;
        auth_request_set $imago_user_timezone $upstream_http_x_user_timezone;
        auth_request_set $imago_user_admin $upstream_http_x_user_admin;

        proxy_pass http://127.0.0.1:__PORTA__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $imago_user_id;
        proxy_set_header X-User-Email $imago_user_email;
        proxy_set_header X-User-Locale $imago_user_locale;
        proxy_set_header X-User-Timezone $imago_user_timezone;
        proxy_set_header X-User-Admin $imago_user_admin;
        proxy_read_timeout 30s;
        client_max_body_size 5m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# Fora do auth_request, para o monitor e o deploy não dependerem do imago
location = /api/ethos/health {
        proxy_pass http://127.0.0.1:__PORTA__/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Email "";
        proxy_set_header X-User-Locale "";
        proxy_set_header X-User-Timezone "";
        proxy_set_header X-User-Admin "";
        proxy_read_timeout 30s;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# A API interna (/internal/*) só é chamada direto em 127.0.0.1, pelo imago, nunca pelo nginx
location /api/ethos/internal/ {
        return 404;
}
