# Rotas do imago, incluídas no server 443 do site (/etc/nginx/apps.d/imago.conf). A porta vem do app.conf.
# Um add_header dentro de location apaga os do server: por isso o HSTS do site se repete em cada um.

location = /imago {
        return 301 /imago/;
}

# Frontend (SPA). index.html e arquivos sem hash no nome: o navegador sempre revalida
# root /var/www (e não alias /var/www/imago/): a pasta tem o nome do prefixo, e o alias tem um bug
# conhecido com try_files que não acha o /imago/index.html. Sem $uri/ (pasta) e com =404 no fim:
# antes do primeiro deploy, sem index.html, o /imago/ dá 404, e não 403 (pasta sem índice) nem um
# ciclo de redirecionamento (500)
location /imago/ {
        root /var/www;
        try_files $uri /imago/index.html =404;

        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# Arquivos com hash no nome: cache longo. Arquivo que não existe é 404, nunca o index.html
location /imago/assets/ {
        root /var/www;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# Login e códigos por email: 10 por minuto por IP, rajada de 5 (zona em /etc/nginx/conf.d/imago.conf)
location /api/imago/auth/ {
        limit_req zone=imago_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:__PORTA__/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# API: o prefixo /api/imago sai antes de chegar no uvicorn (que recebe --root-path /api/imago)
location /api/imago/ {
        proxy_pass http://127.0.0.1:__PORTA__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
}

# A API interna (/internal/*) só é chamada direto em 127.0.0.1, pelas aplicações, nunca pelo nginx
location /api/imago/internal/ {
        return 404;
}

# Quem é o usuário: o auth_request de /api/<app>/ de cada aplicação chama este location (ver
# imago-plan.md, "como as aplicações sabem quem é o usuário"). O imago responde sempre 200, com os
# X-User-* só quando o cookie de sessão vale. internal: de fora, 404. Sem o corpo do request original;
# os cookies vão junto. O X-Forwarded-For é só o IP de quem chamou: o que o cliente mandou não passa
location = /_imago/session {
        internal;
        proxy_pass http://127.0.0.1:__PORTA__/internal/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
}
