name: Ethos

# Checagens em PRs; checagens e deploy em push na main e no workflow_dispatch (rollback).
# Como funciona e o que configurar: apps/ethos/README.md, seção "Deploy".
on:
  push:
    branches: [main]
    paths:
      - "apps/ethos/**"
      - "packages/**"
      - ".github/workflows/ethos.yaml"
      - "infra/apps/ethos/app.conf"
      # Lido pelos testes: nomes do .env.example = app.env + smtp.env (backend) e SUPPORT_EMAIL
      # dos textos legais (frontend)
      - "infra/apps/ethos/app.env"
      # Headers de segurança (CSP) que o vite preview do E2E copia
      - "infra/apps/ethos/nginx.conf"
      # Prazos dos backups, conferidos contra a política de privacidade (frontend)
      - "infra/scripts/snapshot.sh"
      - "infra/lib/backups.sh"
      - "infra/provision.sh"
      - ".github/scripts/check-python-version.sh"
      # Usados pelo apps/ethos/deploy/test-vm.sh (uv e Python como o provision instala; o
      # restore-test.sh do backup-verify.yaml com o banco do ethos populado)
      - "infra/config.env"
      - "infra/lib/common.sh"
      - "infra/lib/packages.sh"
      - "infra/scripts/restore-test.sh"
  pull_request:
    paths:
      - "apps/ethos/**"
      - "packages/**"
      - ".github/workflows/ethos.yaml"
      - "infra/apps/ethos/app.conf"
      # Lido pelos testes: nomes do .env.example = app.env + smtp.env (backend) e SUPPORT_EMAIL
      # dos textos legais (frontend)
      - "infra/apps/ethos/app.env"
      # Headers de segurança (CSP) que o vite preview do E2E copia
      - "infra/apps/ethos/nginx.conf"
      # Prazos dos backups, conferidos contra a política de privacidade (frontend)
      - "infra/scripts/snapshot.sh"
      - "infra/lib/backups.sh"
      - "infra/provision.sh"
      - ".github/scripts/check-python-version.sh"
      # Usados pelo apps/ethos/deploy/test-vm.sh (uv e Python como o provision instala; o
      # restore-test.sh do backup-verify.yaml com o banco do ethos populado)
      - "infra/config.env"
      - "infra/lib/common.sh"
      - "infra/lib/packages.sh"
      - "infra/scripts/restore-test.sh"
  # Rollback (ou deploy de um commit específico): Actions → Ethos → Run workflow, a partir da main
  workflow_dispatch:
    inputs:
      commit:
        description: "SHA completo (40 caracteres) de um commit da main. Rollback: o commit anterior"
        required: true
        type: string

# Em PRs, um push novo cancela o run anterior do mesmo PR. Na main (push e workflow_dispatch), os
# runs andam um de cada vez, na ordem: um mais novo espera e nunca é ultrapassado por um mais velho.
# Nunca o grupo "infra": o GitHub mantém um run pendente por grupo e cancelaria um deploy na fila
# atrás de um provision
concurrency:
  group: ethos-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Só em push e workflow_dispatch: o commit a publicar, se o push muda o que vai para a VM, e o
  # ETHOS_URL. Falha em segundos, sem esperar as checagens
  prepare:
    name: 🧭 Preparar o deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      deploy: ${{ steps.commit.outputs.deploy }}
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Commit do deploy
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          BEFORE: ${{ github.event.before }}
        run: |
          # O que vai para a VM. O resto dos paths do workflow só alimenta os testes
          deploy_paths='^(apps/ethos/(backend|frontend|deploy)/|packages/|\.github/workflows/ethos\.yaml$)'
          deploy=true

          if [[ $EVENT == workflow_dispatch ]]; then
            # A definição do workflow (e os scripts do deploy) vem do branch escolhido no Run workflow
            if [[ $GITHUB_REF != refs/heads/main ]]; then
              echo "::error::Rode o workflow a partir da main (Use workflow from: main)"
              exit 1
            fi
            if [[ ! $INPUT_COMMIT =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::commit: use o SHA completo (40 caracteres hexadecimais, minúsculos) de um commit da main"
              exit 1
            fi
            # Só commits que passaram pela main: nunca um de um PR aberto ou de outro branch
            if ! status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$INPUT_COMMIT...$GITHUB_SHA" --jq .status 2>/dev/null); then
              echo "::error::commit $INPUT_COMMIT não encontrado no repositório"
              exit 1
            fi
            if [[ $status != identical && $status != ahead ]]; then
              echo "::error::$INPUT_COMMIT não é um commit da main"
              exit 1
            fi
            sha=$INPUT_COMMIT
            echo "::notice::deploy manual (rollback) de $sha"
          else
            sha=$GITHUB_SHA
            # Push que só muda arquivos lidos pelos testes (infra/, README): checagens sem deploy. Na
            # dúvida (before desconhecido, comparação com mais de 300 arquivos), faz o deploy
            if [[ $BEFORE =~ ^[0-9a-f]{40}$ && ! $BEFORE =~ ^0+$ ]] \
              && files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null); then
              count=$(grep -c . <<< "$files" || true)
              if ((count < 300)) && ! grep -qE "$deploy_paths" <<< "$files"; then
                deploy=false
                echo "::notice::o push não muda o backend, o frontend, packages/ nem o deploy: só checagens"
              fi
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      # Variável do repositório (Settings → Secrets and variables → Actions → Variables), não fixa
      # aqui: trocar de domínio não mexe no workflow
      - name: ETHOS_URL
        id: url
        if: steps.commit.outputs.deploy == 'true'
        env:
          ETHOS_URL: ${{ vars.ETHOS_URL }}
        run: |
          url=${ETHOS_URL%/}
          if [[ -z $url ]]; then
            echo "::error::Falta a variável ETHOS_URL: Settings → Secrets and variables → Actions → Variables → New repository variable, com o endereço do site (https://<domínio>, sem barra no fim)"
            exit 1
          fi
          if [[ ! $url =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]]; then
            echo "::error::ETHOS_URL inválida: use só https://<domínio>, sem caminho (o health check usa \$ETHOS_URL/api/ethos/health)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  backend:
    name: 🐍 Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ethos/backend
    steps:
      # No workflow_dispatch, o commit escolhido; vazio (push e PR), o commit do evento
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # O setup-uv não publica mais tags de versão maior (v10), só a versão completa
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: apps/ethos/backend
          enable-cache: true
          # Relativo ao working-directory acima
          cache-dependency-glob: uv.lock

      - name: Python igual ao infra/apps/ethos/app.conf
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/check-python-version.sh

      - name: uv.lock em dia com o pyproject.toml
        run: uv lock --check

      - name: Instalar dependências
        run: uv sync --frozen

      - name: ruff check
        run: uv run --no-sync ruff check

      - name: ruff format --check
        run: uv run --no-sync ruff format --check

      - name: pytest (cobertura mínima de 85%)
        run: uv run --no-sync pytest --cov

      # Política de testes: 100% de cobertura (linhas e ramos) nos módulos da lista,
      # lida do .coverage que o pytest acabou de gravar. Para exigir de outro módulo,
      # acrescente uma linha. Cada um é conferido sozinho, então um caminho errado
      # também falha ("No data to report") em vez de passar calado. No rollback
      # (workflow_dispatch), um módulo da lista que ainda não existia no commit é pulado
      - name: Cobertura de 100% nos módulos críticos
        env:
          EVENT: ${{ github.event_name }}
          FULL_COVERAGE: |
            app/admin/accounts.py
            app/admin/banners.py
            app/alerts/service.py
            app/audit.py
            app/auth/deletion.py
            app/auth/deps.py
            app/auth/origin.py
            app/auth/reapply.py
            app/auth/security.py
            app/auth/service.py
            app/habits/access.py
            app/habits/scoring.py
            app/habits/service.py
            app/history/service.py
            app/marks/schemas.py
            app/marks/service.py
            app/pagination.py
            app/progress/service.py
            app/retention.py
            app/score.py
            app/sharing/quota.py
            app/sharing/service.py
        run: |
          for module in $FULL_COVERAGE; do
            if [[ $EVENT == workflow_dispatch && ! -f $module ]]; then
              echo "::notice::$module não existe neste commit"
              continue
            fi
            uv run --no-sync coverage report --fail-under=100 --show-missing --include="$module"
          done

  frontend:
    name: ⚛️ Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ethos/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/ethos/frontend/package-lock.json

      - run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🔨 Build
        run: npm run build

      - name: 🧪 Testes
        run: npm test

      # O deploy publica exatamente este build (o que passou nos testes), sem buildar de novo
      - name: Guardar o build para o deploy
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ethos-frontend
          path: apps/ethos/frontend/dist/
          if-no-files-found: error
          retention-days: 1

  # E2E (Playwright, só Chromium) contra o stack local: backend com banco novo e SMTP falso
  # (backend/tests/e2e_stack.py) e o build de produção no vite preview. Como funciona: seção "E2E"
  # do apps/ethos/README.md
  e2e:
    name: 🎭 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ethos/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      # No rollback (workflow_dispatch), um commit anterior ao E2E não tem a suíte: o job passa
      - name: Suíte E2E no commit
        id: suite
        run: |
          if [[ -f playwright.config.js ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::o commit não tem o E2E (apps/ethos/frontend/playwright.config.js)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v10.3.2
        if: steps.suite.outputs.present == 'true'
        with:
          working-directory: apps/ethos/backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      # O stack do E2E roda com as dependências de dev do backend (aiosmtpd, trustme)
      - name: Dependências do backend
        if: steps.suite.outputs.present == 'true'
        working-directory: apps/ethos/backend
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        if: steps.suite.outputs.present == 'true'
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/ethos/frontend/package-lock.json

      - name: Dependências do frontend
        if: steps.suite.outputs.present == 'true'
        run: npm ci

      # O navegador fica em cache por versão do Playwright; as bibliotecas do sistema (apt) não
      - name: Versão do Playwright
        id: playwright
        if: steps.suite.outputs.present == 'true'
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache do Chromium
        id: browser-cache
        if: steps.suite.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar o Chromium
        if: steps.suite.outputs.present == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Bibliotecas do Chromium
        if: steps.suite.outputs.present == 'true' && steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E
        if: steps.suite.outputs.present == 'true'
        run: npm run e2e

      # Relatório HTML e traces (abrir com npx playwright show-report / show-trace)
      - name: Guardar o relatório do Playwright
        if: failure() && steps.suite.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/ethos/frontend/playwright-report/
            apps/ethos/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Os scripts do deploy (apps/ethos/deploy/), sempre os do commit do workflow
  scripts:
    name: 🧰 Scripts do deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -x apps/ethos/deploy/*.sh

      - name: Limpeza de assets e migrações do rollback
        run: bash apps/ethos/deploy/test-deploy-scripts.sh

      - name: sqlite3
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends sqlite3

      # uv e Python como o provision instala, .venv, migração e API como app-ethos, backup e restart;
      # depois, com o banco populado, o restore do infra/RESTORE.md (reapply-deletions) e o
      # restore-test.sh do backup-verify.yaml
      - name: Passos da VM (vm.sh), restore e backup-verify
        run: sudo bash apps/ethos/deploy/test-vm.sh

  # Os 9 passos do deploy: checagens (needs) → VM pronta → backend → dependências → backup →
  # restart (migração) → health check → front → limpeza. Qualquer falha para o job ali
  deploy:
    name: 🚀 Deploy
    needs: [prepare, backend, frontend, e2e, scripts]
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    # Nunca dois deploys ao mesmo tempo (nem com o provision, que usa o grupo "infra")
    concurrency:
      group: ethos-deploy
      cancel-in-progress: false
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      ETHOS_URL: ${{ needs.prepare.outputs.url }}
    steps:
      # Scripts do deploy e migrações da main (commit do workflow); o código a publicar em target/
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/ethos/deploy
            apps/ethos/backend/migrations

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: target
          sparse-checkout: apps/ethos/backend

      - uses: actions/download-artifact@v4
        with:
          name: ethos-frontend
          path: dist

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" >> "$GITHUB_ENV"
          echo "TARGET=$REMOTE_USER@$REMOTE_HOST" >> "$GITHUB_ENV"

      # Os passos na VM vão como "bash -s" com o script no stdin: nada fica gravado lá
      - name: VM pronta (unit, pastas, uv, Python, banco)
        run: |
          python=$(<target/apps/ethos/backend/.python-version)
          $SSH "$TARGET" bash -s -- check "$python" < apps/ethos/deploy/vm.sh

      # Rollback para antes de uma migração já aplicada: o alembic do commit antigo não acharia a
      # revisão do banco. As migrações são só aditivas; o commit leva os arquivos que faltam
      - name: Migrações já aplicadas no banco
        run: |
          revision=$($SSH "$TARGET" bash -s -- revision < apps/ethos/deploy/vm.sh)
          bash apps/ethos/deploy/keep-migrations.sh \
            target/apps/ethos/backend/migrations/versions apps/ethos/backend/migrations/versions "$revision"

      - name: Enviar o backend
        run: |
          rsync -rlptz --chmod=D0755,F0644 --delete --filter="merge apps/ethos/deploy/backend.rsync-filter" \
            -e "$SSH" target/apps/ethos/backend/ "$TARGET:/opt/apps/ethos/"

      - name: Instalar dependências (uv sync) e bytecode
        run: $SSH "$TARGET" bash -s -- install < apps/ethos/deploy/vm.sh

      - name: Backup do banco (pre-deploy-<sha>.db)
        run: $SSH "$TARGET" bash -s -- backup "$SHA" < apps/ethos/deploy/vm.sh

      # Se a migração falhar, o serviço não sobe, o job para aqui e o front anterior fica no ar
      - name: Reiniciar (migração no ExecStartPre)
        run: $SSH "$TARGET" bash -s -- restart < apps/ethos/deploy/vm.sh

      - name: Health check
        run: |
          url="$ETHOS_URL/api/ethos/health"
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 "$url"; then
              echo
              exit 0
            fi
            echo "tentativa $attempt de 10 falhou"
            if ((attempt < 10)); then
              sleep 3
            fi
          done
          echo "::error::$url não respondeu 200 em 10 tentativas. O front anterior continua no ar. Na VM: journalctl -u app-ethos -n 50 --no-pager"
          exit 1

      # Sem --delete: os assets da versão anterior ficam para as abas abertas com ela. O index.html
      # vai por último, quando tudo o que ele carrega já está lá
      - name: Publicar o front
        run: |
          [[ -f dist/index.html && -d dist/assets ]] || { echo "::error::build do front sem index.html ou assets/"; exit 1; }
          rsync -rlptz --chmod=D0755,F0644 --exclude=/index.html -e "$SSH" dist/ "$TARGET:/var/www/ethos/"
          rsync -rlptz --chmod=F0644 -e "$SSH" dist/index.html "$TARGET:/var/www/ethos/index.html"

      - name: Limpar assets com mais de 7 dias fora do build atual
        run: |
          mapfile -t files < <(cd dist/assets && find . -type f -printf '%P\n' | sort)
          ((${#files[@]})) || { echo "::error::dist/assets vazio"; exit 1; }
          # A lista vira argumentos do comando remoto: printf %q protege do shell da VM
          args=$(printf '%q ' /var/www/ethos/assets 7 "${files[@]}")
          $SSH "$TARGET" "bash -s -- $args" < apps/ethos/deploy/clean-assets.sh

      - name: Resumo
        run: |
          {
            echo "### ethos publicado"
            echo
            echo "- commit: \`$SHA\`"
            echo "- health: $ETHOS_URL/api/ethos/health"
          } >> "$GITHUB_STEP_SUMMARY"
