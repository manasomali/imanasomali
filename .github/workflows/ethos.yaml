name: Ethos

on:
  push:
    branches: [main]
    paths:
      - "apps/ethos/**"
      - "packages/**"
      - ".github/workflows/ethos.yaml"
      - "infra/apps/ethos/app.conf"
      # Lidos pelos testes do backend (nomes do .env.example = app.env + smtp.env)
      - "infra/apps/ethos/app.env"
      - "infra/provision.sh"
      - ".github/scripts/check-python-version.sh"
  pull_request:
    paths:
      - "apps/ethos/**"
      - "packages/**"
      - ".github/workflows/ethos.yaml"
      - "infra/apps/ethos/app.conf"
      # Lidos pelos testes do backend (nomes do .env.example = app.env + smtp.env)
      - "infra/apps/ethos/app.env"
      - "infra/provision.sh"
      - ".github/scripts/check-python-version.sh"

# Só checagens por enquanto; o deploy entra depois, com grupo próprio. Nunca o
# grupo "infra": o GitHub mantém um run pendente por grupo e cancelaria um deploy
# na fila atrás de um provision. Aqui, um push novo no mesmo PR cancela o anterior
concurrency:
  group: ethos-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: 🐍 Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ethos/backend
    steps:
      - uses: actions/checkout@v4

      # O setup-uv não publica mais tags de versão maior (v10), só a versão completa
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: apps/ethos/backend
          enable-cache: true
          # Relativo ao working-directory acima
          cache-dependency-glob: uv.lock

      - name: Python igual ao infra/apps/ethos/app.conf
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/check-python-version.sh

      - name: uv.lock em dia com o pyproject.toml
        run: uv lock --check

      - name: Instalar dependências
        run: uv sync --frozen

      - name: ruff check
        run: uv run --no-sync ruff check

      - name: ruff format --check
        run: uv run --no-sync ruff format --check

      - name: pytest (cobertura mínima de 85%)
        run: uv run --no-sync pytest --cov

      # Política de testes: 100% de cobertura (linhas e ramos) nos módulos da lista,
      # lida do .coverage que o pytest acabou de gravar. Para exigir de outro módulo,
      # acrescente uma linha. Cada um é conferido sozinho, então um caminho errado
      # também falha ("No data to report") em vez de passar calado
      - name: Cobertura de 100% nos módulos críticos
        env:
          FULL_COVERAGE: |
            app/audit.py
            app/auth/deps.py
            app/auth/origin.py
            app/auth/security.py
            app/auth/service.py
            app/habits/access.py
            app/habits/scoring.py
            app/habits/service.py
            app/marks/schemas.py
            app/marks/service.py
            app/progress/service.py
            app/retention.py
            app/score.py
            app/sharing/quota.py
            app/sharing/service.py
        run: |
          for module in $FULL_COVERAGE; do
            uv run --no-sync coverage report --fail-under=100 --show-missing --include="$module"
          done

  frontend:
    name: ⚛️ Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ethos/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/ethos/frontend/package-lock.json

      - run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🔨 Build
        run: npm run build

      - name: 🧪 Testes
        run: npm test
