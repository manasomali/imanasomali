name: Infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yaml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yaml"
      - ".github/scripts/**"
      # nginx de dev, gerado a partir de infra/apps/ (o nginx -t dele roda aqui). Só em PR: no push
      # na main, uma mudança só nele não precisa de provision
      - "apps/imago/dev/**"
  workflow_dispatch:

# Nunca dois provisions (nem um provision e um teste de restauração) ao mesmo tempo
concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  lint:
    name: 🔍 Validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -x infra/provision.sh infra/scripts/*.sh infra/tests/*.sh .github/scripts/*.sh apps/imago/dev/*.sh

      - name: databases.txt
        run: bash -c 'source infra/lib/common.sh && read_databases infra/databases.txt'

      - name: Portas dos app.conf únicas e na tabela do infra/README.md
        run: bash .github/scripts/check-ports.sh

      - name: Testes do stdin e dos arquivos de ambiente (infra/tests)
        run: sudo bash infra/tests/test-input.sh

      - name: Testes dos tokens da API interna (infra/tests)
        run: sudo bash infra/tests/test-internal-tokens.sh

      - name: Teste da checagem do IMAGO_APPS
        run: bash .github/scripts/test-check-imago-apps.sh

      - name: nginx -t (mesma versão da VM, com certificados falsos, o site e as rotas das apps)
        run: |
          stub=$(mktemp -d)
          bash .github/scripts/nginx-stub-config.sh "$stub"
          # O modelo genérico também, como o provision o instalaria
          sed -e 's/__PROJETO__/exemplo/g' -e 's/__PORTA__/3999/g' \
            infra/templates/app-nginx.conf.tmpl > "$stub/apps.d/exemplo.conf"
          ls "$stub/apps.d" "$stub/conf.d"
          docker run --rm \
            -v "$stub/conf.d:/etc/nginx/conf.d:ro" \
            -v "$stub/le:/etc/letsencrypt:ro" \
            -v "$stub/apps.d:/etc/nginx/apps.d:ro" \
            nginx:1.24 nginx -t

      - name: nginx -t na config de dev (apps/imago/dev)
        run: bash apps/imago/dev/nginx.sh check

      # Por último, para uma falha aqui não esconder as checagens acima: conferem o infra/apps/
      # contra o código das apps (apps/<nome>/)
      - name: Python do app.conf igual ao .python-version de cada app
        run: bash .github/scripts/check-python-version.sh

      - name: IMAGO_APPS com todas as apps, nas portas dos app.conf, e os textos delas no front do imago
        run: bash .github/scripts/check-imago-apps.sh

  # install_uv e install_pythons de verdade, no mesmo Ubuntu da VM
  uv:
    name: 🐍 uv e Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar, repetir sem baixar nada e recusar checksum errado
        run: sudo bash .github/scripts/test-install-uv.sh

  # provision_databases e provision_apps de verdade, com systemd: pastas, donos, sudo do deploy,
  # units (systemd-analyze verify, stubs no lugar do código), app removida e snapshot
  apps:
    name: 📁 Pastas e units das apps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: sqlite3 e nginx
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends sqlite3 nginx

      - name: Provisionar as apps, repetir sem mudar nada e conferir pastas, units e remoção
        run: sudo DEPLOY_USER="$USER" bash .github/scripts/test-provision-apps.sh

  # provision_nginx de verdade no nginx 1.24 do Ubuntu 24.04: site e rotas das apps com curl,
  # cache, headers de segurança, rate limit do auth e rollback quando o nginx -t falha
  nginx:
    name: 🌐 Rotas das apps no nginx
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: nginx
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends nginx

      - name: Instalar as rotas e testar com curl
        run: sudo bash .github/scripts/test-provision-nginx.sh

  # Quem é o usuário: o auth_request de cada app para o imago, no container nginx:1.24 com a config
  # de produção, um imago falso e uma app de teste; nenhum X-User-* do cliente chega aos backends
  nginx-auth:
    name: 🔐 auth_request do imago no nginx
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: imago falso, app de teste e as apps de infra/apps/ com auth_request
        run: bash .github/scripts/test-nginx-auth.sh

  deploy:
    name: 🚀 Provisionar VM
    needs: [lint, uv, apps, nginx, nginx-auth]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" >> "$GITHUB_ENV"
          echo "TARGET=$REMOTE_USER@$REMOTE_HOST" >> "$GITHUB_ENV"

      - name: Enviar infra/ para /opt/infra
        run: |
          chmod +x infra/provision.sh infra/scripts/*.sh
          $SSH "$TARGET" 'sudo -n install -d -o "$(id -un)" -g "$(id -gn)" -m 0755 /opt/infra'
          rsync -az --delete -e "$SSH" infra/ "$TARGET:/opt/infra/"

      # Credenciais vão pelo stdin: nunca aparecem em argumentos (ps) nem em logs
      - name: Provisionar
        env:
          LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
          LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          names=(LITESTREAM_ACCESS_KEY_ID LITESTREAM_SECRET_ACCESS_KEY S3_ENDPOINT S3_BUCKET OCI_REGION
            SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD)
          for name in "${names[@]}"; do
            [[ -n ${!name} ]] || echo "::warning::$name está vazio no GitHub (Settings → Secrets and variables → Actions)"
            # Uma quebra de linha viraria outra linha no stdin. O provision recusa, mas para aqui antes
            if [[ ${!name} == *$'\n'* || ${!name} == *$'\r'* ]]; then
              echo "::error::$name tem quebra de linha; cadastre o valor de novo no GitHub"
              exit 1
            fi
          done
          for name in "${names[@]}"; do
            printf '%s=%s\n' "$name" "${!name}"
          done | $SSH "$TARGET" 'sudo -n /opt/infra/provision.sh'
