name: Infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yaml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yaml"
  workflow_dispatch:

# Nunca dois provisions (nem um provision e um teste de restauração) ao mesmo tempo
concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  lint:
    name: 🔍 Validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -x infra/provision.sh infra/scripts/*.sh

      - name: databases.txt
        run: bash -c 'source infra/lib/common.sh && read_databases infra/databases.txt'

      - name: nginx -t (mesma versão da VM, com certificados falsos)
        run: |
          source infra/config.env
          stub=$(mktemp -d)
          mkdir -p "$stub/le/live/$SITE_DOMAIN" "$stub/apps.d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$SITE_DOMAIN" \
            -keyout "$stub/le/live/$SITE_DOMAIN/privkey.pem" \
            -out "$stub/le/live/$SITE_DOMAIN/fullchain.pem" 2>/dev/null
          touch "$stub/le/options-ssl-nginx.conf"
          openssl dhparam -dsaparam -out "$stub/le/ssl-dhparams.pem" 2048 2>/dev/null
          sed -e 's/__PROJETO__/exemplo/g' -e 's/__PORTA__/3001/g' \
            infra/templates/app-nginx.conf.tmpl > "$stub/apps.d/exemplo.conf"
          docker run --rm \
            -v "$PWD/infra/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$stub/le:/etc/letsencrypt:ro" \
            -v "$stub/apps.d:/etc/nginx/apps.d:ro" \
            nginx:1.18 nginx -t

  deploy:
    name: 🚀 Provisionar VM
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" >> "$GITHUB_ENV"
          echo "TARGET=$REMOTE_USER@$REMOTE_HOST" >> "$GITHUB_ENV"

      - name: Enviar infra/ para /opt/infra
        run: |
          chmod +x infra/provision.sh infra/scripts/*.sh
          $SSH "$TARGET" 'sudo -n install -d -o "$(id -un)" -g "$(id -gn)" -m 0755 /opt/infra'
          rsync -az --delete -e "$SSH" infra/ "$TARGET:/opt/infra/"

      # Credenciais vão pelo stdin: nunca aparecem em argumentos (ps) nem em logs
      - name: Provisionar
        env:
          LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
          LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          for name in LITESTREAM_ACCESS_KEY_ID LITESTREAM_SECRET_ACCESS_KEY S3_ENDPOINT S3_BUCKET OCI_REGION; do
            [[ -n ${!name} ]] || echo "::warning::$name está vazio no GitHub (Settings → Secrets and variables → Actions)"
          done
          printf '%s\n' \
            "LITESTREAM_ACCESS_KEY_ID=$LITESTREAM_ACCESS_KEY_ID" \
            "LITESTREAM_SECRET_ACCESS_KEY=$LITESTREAM_SECRET_ACCESS_KEY" \
            "S3_ENDPOINT=$S3_ENDPOINT" \
            "S3_BUCKET=$S3_BUCKET" \
            "OCI_REGION=$OCI_REGION" \
            | $SSH "$TARGET" 'sudo -n /opt/infra/provision.sh'
