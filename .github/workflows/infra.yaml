name: Infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yaml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yaml"
      - ".github/scripts/**"
  workflow_dispatch:

# Nunca dois provisions (nem um provision e um teste de restauração) ao mesmo tempo
concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  lint:
    name: 🔍 Validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -x infra/provision.sh infra/scripts/*.sh infra/tests/*.sh .github/scripts/*.sh

      - name: databases.txt
        run: bash -c 'source infra/lib/common.sh && read_databases infra/databases.txt'

      - name: Python do app.conf igual ao .python-version de cada app
        run: bash .github/scripts/check-python-version.sh

      - name: Portas dos app.conf únicas e na tabela do infra/README.md
        run: bash .github/scripts/check-ports.sh

      - name: Testes do stdin e dos arquivos de ambiente (infra/tests)
        run: sudo bash infra/tests/test-input.sh

      - name: nginx -t (mesma versão da VM, com certificados falsos)
        run: |
          source infra/config.env
          stub=$(mktemp -d)
          mkdir -p "$stub/le/live/$SITE_DOMAIN" "$stub/apps.d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$SITE_DOMAIN" \
            -keyout "$stub/le/live/$SITE_DOMAIN/privkey.pem" \
            -out "$stub/le/live/$SITE_DOMAIN/fullchain.pem" 2>/dev/null
          touch "$stub/le/options-ssl-nginx.conf"
          openssl dhparam -dsaparam -out "$stub/le/ssl-dhparams.pem" 2048 2>/dev/null
          sed -e 's/__PROJETO__/exemplo/g' -e 's/__PORTA__/3001/g' \
            infra/templates/app-nginx.conf.tmpl > "$stub/apps.d/exemplo.conf"
          docker run --rm \
            -v "$PWD/infra/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$stub/le:/etc/letsencrypt:ro" \
            -v "$stub/apps.d:/etc/nginx/apps.d:ro" \
            nginx:1.24 nginx -t

  # install_uv e install_pythons de verdade, no mesmo Ubuntu da VM
  uv:
    name: 🐍 uv e Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar, repetir sem baixar nada e recusar checksum errado
        run: sudo bash .github/scripts/test-install-uv.sh

  # provision_databases e provision_apps de verdade, com systemd: pastas, donos, sudo do deploy,
  # units (systemd-analyze verify, stubs no lugar do código), app removida e snapshot
  apps:
    name: 📁 Pastas e units das apps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: sqlite3 e nginx
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends sqlite3 nginx

      - name: Provisionar as apps, repetir sem mudar nada e conferir pastas, units e remoção
        run: sudo DEPLOY_USER="$USER" bash .github/scripts/test-provision-apps.sh

  deploy:
    name: 🚀 Provisionar VM
    needs: [lint, uv, apps]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" >> "$GITHUB_ENV"
          echo "TARGET=$REMOTE_USER@$REMOTE_HOST" >> "$GITHUB_ENV"

      - name: Enviar infra/ para /opt/infra
        run: |
          chmod +x infra/provision.sh infra/scripts/*.sh
          $SSH "$TARGET" 'sudo -n install -d -o "$(id -un)" -g "$(id -gn)" -m 0755 /opt/infra'
          rsync -az --delete -e "$SSH" infra/ "$TARGET:/opt/infra/"

      # Credenciais vão pelo stdin: nunca aparecem em argumentos (ps) nem em logs
      - name: Provisionar
        env:
          LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
          LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          names=(LITESTREAM_ACCESS_KEY_ID LITESTREAM_SECRET_ACCESS_KEY S3_ENDPOINT S3_BUCKET OCI_REGION
            SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD)
          for name in "${names[@]}"; do
            [[ -n ${!name} ]] || echo "::warning::$name está vazio no GitHub (Settings → Secrets and variables → Actions)"
            # Uma quebra de linha viraria outra linha no stdin. O provision recusa, mas para aqui antes
            if [[ ${!name} == *$'\n'* || ${!name} == *$'\r'* ]]; then
              echo "::error::$name tem quebra de linha; cadastre o valor de novo no GitHub"
              exit 1
            fi
          done
          for name in "${names[@]}"; do
            printf '%s=%s\n' "$name" "${!name}"
          done | $SSH "$TARGET" 'sudo -n /opt/infra/provision.sh'
