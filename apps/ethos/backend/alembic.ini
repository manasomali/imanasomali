# Configuração do Alembic. O banco NÃO fica aqui: o caminho vem da variável DATABASE_PATH (a mesma
# do app), lida por migrations/env.py. Localmente, na pasta do backend:
#   uv run --env-file .env alembic upgrade head

[alembic]
script_location = %(here)s/migrations
# Põe a pasta do backend no sys.path, para o env.py importar o pacote app
prepend_sys_path = %(here)s
path_separator = os
# Migrações numeradas e escritas à mão: alembic revision --rev-id 0002 -m "<descrição>"
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Formata a migração gerada pelo `alembic revision` (python -m ruff format)
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
