# Server do nginx de desenvolvimento (apps/imago/dev/nginx.sh), no lugar do server 443 do site:
# origem única http://localhost:__LISTEN__, com as rotas de cada aplicação geradas a partir de
# infra/apps/*/nginx.conf em /etc/nginx/apps.d/. O site não roda aqui: / leva ao imago, e o que não
# é de uma aplicação dá 404.

# Upgrade do WebSocket do HMR do Vite (nginx.sh up --vite)
map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
}

server {
        listen __LISTEN__;
        server_name localhost;

        include /etc/nginx/apps.d/*.conf;

        location = / {
                return 302 /imago/;
        }

        location / {
                return 404;
        }
}
